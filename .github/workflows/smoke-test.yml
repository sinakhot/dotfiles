name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly cron — catches upstream package/regression drift
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  # ─── Ubuntu (host runner; chezmoi applies the checked-out tree directly) ───
  ubuntu:
    name: ubuntu-${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [bootstrap-only, with-dotfiles]
    steps:
      - uses: actions/checkout@v5

      - name: Run installer (bootstrap only)
        if: matrix.scope == 'bootstrap-only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_DOTFILES: "1"
          SKIP_MISE: "1"
          SKIP_FISH: "1"
          NONINTERACTIVE: "1"
        run: bash install.sh

      - name: Run installer (with dotfiles + mise)
        if: matrix.scope == 'with-dotfiles'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apply the checked-out working tree, not a remote clone — so the test
          # never depends on the PR branch still existing on the remote (it may
          # be deleted the instant the PR merges, mid-run).
          DOTFILES_SOURCE: ${{ github.workspace }}
          SKIP_FISH: "1"
          NONINTERACTIVE: "1"
        run: bash install.sh

      - name: Verify bootstrap tools
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          command -v fish
          command -v mise
          command -v chezmoi
          fish --version
          mise --version
          chezmoi --version

      - name: Verify mise-installed tools
        if: matrix.scope == 'with-dotfiles'
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          mise ls
          # Spot-check a few tools resolve
          mise which starship
          mise which herdr
          mise which fzf
          mise which rg
          mise which gh

  # ─── Arch (container) ────────────────────────────────────────
  arch:
    name: arch-bootstrap
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install prerequisites
        run: pacman -Syu --noconfirm git sudo
      - uses: actions/checkout@v5
      - name: Run installer (bootstrap only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_DOTFILES: "1"
          SKIP_MISE: "1"
          SKIP_FISH: "1"
          NONINTERACTIVE: "1"
        run: bash install.sh
      - name: Verify bootstrap tools
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          command -v fish
          command -v mise
          command -v chezmoi

  # ─── macOS ───────────────────────────────────────────────────
  macos:
    name: macos-bootstrap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run installer (bootstrap only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_DOTFILES: "1"
          SKIP_MISE: "1"
          SKIP_FISH: "1"
          NONINTERACTIVE: "1"
        run: bash install.sh
      - name: Verify bootstrap tools
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          command -v fish
          command -v mise
          command -v chezmoi

  # ─── Shell lint ──────────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning
