# ~/.config/mise/config.toml — managed by chezmoi (sinakhot/dotfiles)
# https://mise.jdx.dev/configuration.html
#
# All tools installed as prebuilt binaries via the `ubi` backend.
# `mise install` provisions everything below identically across platforms.

[tools]
# ── Languages (mise's primary use) ──────────────────────────────
node    = "lts"
python  = "3.12"
go      = "latest"

# ── Foundation ──────────────────────────────────────────────────
"ubi:starship/starship"        = "latest"
"ubi:zellij-org/zellij"        = "latest"
"ubi:junegunn/fzf"             = "latest"
"ubi:ajeetdsouza/zoxide"       = "latest"

# ── File / search replacements ──────────────────────────────────
"ubi:BurntSushi/ripgrep"       = { version = "latest", exe = "rg" }
"ubi:sharkdp/fd"               = "latest"
"ubi:sharkdp/bat"              = "latest"
"ubi:eza-community/eza"        = "latest"

# ── Dev / git ───────────────────────────────────────────────────
"ubi:cli/cli"                  = { version = "latest", exe = "gh" }
"ubi:direnv/direnv"            = "latest"
"ubi:jesseduffield/lazygit"    = "latest"
"ubi:dandavison/delta"         = "latest"

# ── Language ecosystem speedups ─────────────────────────────────
"ubi:astral-sh/uv"             = "latest"
"ubi:cargo-bins/cargo-binstall" = "latest"

# ── Editor ──────────────────────────────────────────────────────
"ubi:neovim/neovim"            = { version = "stable", exe = "nvim" }

# ── System monitoring ───────────────────────────────────────────
"ubi:aristocratos/btop"        = "latest"
"ubi:bootandy/dust"            = "latest"
"ubi:muesli/duf"               = "latest"
"ubi:dalance/procs"            = "latest"

# ── Data wrangling ──────────────────────────────────────────────
"ubi:jqlang/jq"                = "latest"
"ubi:mikefarah/yq"             = "latest"
"ubi:tomnomnom/gron"           = "latest"
"ubi:johnkerl/miller"          = { version = "latest", exe = "mlr" }

# ── Task runner ─────────────────────────────────────────────────
"ubi:go-task/task"             = "latest"

# ── Kubernetes ──────────────────────────────────────────────────
kubectl                          = "latest"
helm                             = "latest"
"ubi:derailed/k9s"               = "latest"
"ubi:ahmetb/kubectx"             = "latest"
"ubi:stern/stern"                = "latest"
"ubi:fluxcd/flux2"               = { version = "latest", exe = "flux" }

# ── Secrets ─────────────────────────────────────────────────────
"ubi:getsops/sops"               = "latest"
"ubi:FiloSottile/age"            = "latest"
# keychain: distro pkg (portable shell script, no per-OS binary release).
# Installed in install.sh stage_bootstrap.

# ── HTTP / reference / benchmark ────────────────────────────────
"ubi:ducaale/xh"                 = "latest"
"ubi:tldr-pages/tlrc"            = { version = "latest", exe = "tldr" }
"ubi:sharkdp/hyperfine"          = "latest"

[settings]
# Auto-install missing tools when running `mise <cmd>` in a dir with .mise.toml
not_found_auto_install = true
# Quieter activation
quiet = false
# Trust this config without explicit `mise trust`
# (set per-machine via `mise trust ~/.config/mise/config.toml` if you'd rather)
