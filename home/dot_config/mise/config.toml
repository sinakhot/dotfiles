# ~/.config/mise/config.toml — managed by chezmoi (sinakhot/dotfiles)
# https://mise.jdx.dev/configuration.html
#
# Tools installed via the `aqua` backend (mise's preferred backend for all of
# these): curated asset selection + checksum/SLSA verification, and avoids the
# github/ubi backend's wrong-asset guessing (see devpod note below).
# `github:` is the exception, used only where aqua's registry lags or lacks a tool.
# Tools with `os = ["linux"]` are linux-only here; macOS provisions them via brew
# in install.sh stage_bootstrap (btop, eza, dust — no macOS-arm64 prebuilts upstream).
# `mise install` provisions everything below identically across platforms.

[tools]
# ── Languages (mise's primary use) ──────────────────────────────
node    = "lts"
python  = "3.12"
go      = "latest"

# ── Foundation ──────────────────────────────────────────────────
"aqua:starship/starship"          = "latest"
"ubi:ogulcancelik/herdr"          = "latest"
"aqua:junegunn/fzf"               = "latest"
"aqua:ajeetdsouza/zoxide"         = "latest"

# ── File / search replacements ──────────────────────────────────
"aqua:BurntSushi/ripgrep"         = { version = "latest", exe = "rg" }
"aqua:sharkdp/fd"                 = "latest"
"aqua:sharkdp/bat"                = "latest"
"aqua:eza-community/eza"          = { version = "latest", os = ["linux"] }

# ── Dev / git ───────────────────────────────────────────────────
"aqua:cli/cli"                    = { version = "latest", exe = "gh" }
"aqua:direnv/direnv"              = "latest"
"aqua:jesseduffield/lazygit"      = "latest"
"aqua:dandavison/delta"           = "latest"
# devpod: aqua picks the raw `devpod-<os>-<arch>` CLI binary. The github/ubi
# backend wrongly selects the desktop bundle (DevPod_*.tar.gz → dev-pod-desktop).
# Pinned to the last stable (0.6.15) — every newer release is an alpha
# pre-release, so `latest` resolves to nothing and warns. The os filter still
# skips install on linux-arm64 (no arm64 asset), but `latest` would also make
# mise try (and fail) to resolve a version list there; a pinned version skips
# that resolution entirely, silencing the WARN on arm64 hosts.
"aqua:loft-sh/devpod"             = { version = "0.6.15", os = ["linux/x64", "macos"] }

# ── Language ecosystem speedups ─────────────────────────────────
"aqua:astral-sh/uv"               = "latest"
"aqua:cargo-bins/cargo-binstall"  = "latest"

# ── Editor ──────────────────────────────────────────────────────
"aqua:neovim/neovim"           = "latest"

# ── System monitoring ───────────────────────────────────────────
"aqua:aristocratos/btop"       = { version = "latest", os = ["linux"] }
"aqua:bootandy/dust"              = { version = "latest", os = ["linux"] }
"aqua:muesli/duf"                 = "latest"
# procs: no linux-arm64 prebuilt in aqua registry → skip on that platform.
"aqua:dalance/procs"              = { version = "latest", os = ["linux/x64", "macos"] }

# ── Data wrangling ──────────────────────────────────────────────
"aqua:jqlang/jq"                  = "latest"
"aqua:mikefarah/yq"               = "latest"
"aqua:tomnomnom/gron"             = "latest"
"aqua:johnkerl/miller"            = { version = "latest", exe = "mlr" }

# ── Task runner ─────────────────────────────────────────────────
"aqua:go-task/task"               = "latest"

# ── Kubernetes ──────────────────────────────────────────────────
kubectl                          = "latest"
helm                             = "latest"
"aqua:derailed/k9s"                 = "latest"
"aqua:ahmetb/kubectx"               = "latest"
"aqua:stern/stern"                  = "latest"
"aqua:fluxcd/flux2"                 = { version = "latest", exe = "flux" }

# ── Secrets ─────────────────────────────────────────────────────
"aqua:getsops/sops"                 = "latest"
"aqua:FiloSottile/age"              = "latest"
# keychain: distro pkg (portable shell script, no per-OS binary release).
# Installed in install.sh stage_bootstrap.

# ── HTTP / reference / benchmark ────────────────────────────────
"aqua:ducaale/xh"                   = "latest"
# tlrc: no linux-arm64 prebuilt in aqua registry → skip on that platform.
"aqua:tldr-pages/tlrc"              = { version = "latest", exe = "tldr", os = ["linux/x64", "macos"] }
"aqua:sharkdp/hyperfine"            = "latest"

[settings]
# Auto-install missing tools when running `mise <cmd>` in a dir with .mise.toml
not_found_auto_install = true
# Quieter activation
quiet = false
# Trust this config without explicit `mise trust`
# (set per-machine via `mise trust ~/.config/mise/config.toml` if you'd rather)
