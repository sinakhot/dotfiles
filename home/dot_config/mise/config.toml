# ~/.config/mise/config.toml — managed by chezmoi (sinakhot/dotfiles)
# https://mise.jdx.dev/configuration.html
#
# Most tools installed as prebuilt binaries via the `github` backend (formerly `ubi`).
# Some use `aqua` for cross-platform coverage where upstream lacks macOS releases.
# Tools with `os = ["linux"]` are linux-only here; macOS provisions them via brew
# in install.sh stage_bootstrap (btop, eza, dust — no macOS-arm64 prebuilts upstream).
# `mise install` provisions everything below identically across platforms.

[tools]
# ── Languages (mise's primary use) ──────────────────────────────
node    = "lts"
python  = "3.12"
go      = "latest"

# ── Foundation ──────────────────────────────────────────────────
"github:starship/starship"        = "latest"
"github:zellij-org/zellij"        = "latest"
"github:junegunn/fzf"             = "latest"
"github:ajeetdsouza/zoxide"       = "latest"

# ── File / search replacements ──────────────────────────────────
"github:BurntSushi/ripgrep"       = { version = "latest", exe = "rg" }
"github:sharkdp/fd"               = "latest"
"github:sharkdp/bat"              = "latest"
"aqua:eza-community/eza"       = { version = "latest", os = ["linux"] }
"github:sxyazi/yazi"              = { version = "latest", exe = "yazi" }

# ── Dev / git ───────────────────────────────────────────────────
"github:cli/cli"                  = { version = "latest", exe = "gh" }
"github:direnv/direnv"            = "latest"
"github:jesseduffield/lazygit"    = "latest"
"github:dandavison/delta"         = "latest"

# ── Language ecosystem speedups ─────────────────────────────────
"github:astral-sh/uv"             = "latest"
"github:cargo-bins/cargo-binstall" = "latest"

# ── Editor ──────────────────────────────────────────────────────
"aqua:neovim/neovim"           = "latest"

# ── System monitoring ───────────────────────────────────────────
"aqua:aristocratos/btop"       = { version = "latest", os = ["linux"] }
"github:bootandy/dust"            = { version = "latest", os = ["linux"] }
"github:muesli/duf"               = "latest"
"github:dalance/procs"            = "latest"

# ── Data wrangling ──────────────────────────────────────────────
"github:jqlang/jq"                = "latest"
"github:mikefarah/yq"             = "latest"
"github:tomnomnom/gron"           = "latest"
"github:johnkerl/miller"          = { version = "latest", exe = "mlr" }

# ── Task runner ─────────────────────────────────────────────────
"github:go-task/task"             = "latest"

# ── Kubernetes ──────────────────────────────────────────────────
kubectl                          = "latest"
helm                             = "latest"
"github:derailed/k9s"               = "latest"
"github:ahmetb/kubectx"             = "latest"
"github:stern/stern"                = "latest"
"github:fluxcd/flux2"               = { version = "latest", exe = "flux" }

# ── Secrets ─────────────────────────────────────────────────────
"github:getsops/sops"               = "latest"
"github:FiloSottile/age"            = "latest"
# keychain: distro pkg (portable shell script, no per-OS binary release).
# Installed in install.sh stage_bootstrap.

# ── HTTP / reference / benchmark ────────────────────────────────
"github:ducaale/xh"                 = "latest"
"github:tldr-pages/tlrc"            = { version = "latest", exe = "tldr" }
"github:sharkdp/hyperfine"          = "latest"

[settings]
# Auto-install missing tools when running `mise <cmd>` in a dir with .mise.toml
not_found_auto_install = true
# Quieter activation
quiet = false
# Trust this config without explicit `mise trust`
# (set per-machine via `mise trust ~/.config/mise/config.toml` if you'd rather)
