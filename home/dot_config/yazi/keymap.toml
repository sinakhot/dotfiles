# Override default Enter so it enters dirs instead of opening them in $EDITOR.
# Yazi default `open` treats dirs as files and routes them through the opener
# rules (which fall through to $EDITOR). smart-enter dispatches `enter` for
# dirs and `open` for files.

[[mgr.prepend_keymap]]
on  = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the dir or open the file"

[[mgr.prepend_keymap]]
on  = "<S-Enter>"
run = "plugin smart-enter --args=--interactive"
desc = "Enter the dir or open the file interactively"
